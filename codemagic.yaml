workflows:
ios-build:
name: iOS Build
max_build_duration: 60
instance_type: mac_mini_m1
environment:
flutter: 3.22.0
xcode: latest
cocoapods: default

triggering:
events:
- push
branch_patterns:
- pattern: main
include: true

scripts:
- name: Fix iOS folder + get deps
script: |
flutter config --no-analytics
flutter pub get
rm -rf ios # DELETE YOUR BROKEN UPLOADED IOS FOLDER — MUST HAVE
flutter create --platforms=ios . # MAKE FRESH, PERFECT IOS PROJECT — MUST HAVE

- name: Build iOS Release
script: |
flutter build ios --release --no-codesign --verbose

artifacts:
- build/ios/ipa/*.ipa
- /tmp/xcodebuild_logs/*.log
